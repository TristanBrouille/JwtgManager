spring.application.name=jwtgmanager

# Secrets locaux (non versionnés) : DB_PASSWORD, JWTG_JWT_SECRET...
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pwtgmanagerdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

# Le schéma est géré par src/main/resources/db/jwtg_schema.sql : Hibernate vérifie seulement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwtg.security.jwt-secret=${JWTG_JWT_SECRET}
jwtg.security.token-validity=7d
jwtg.security.allowed-origins=http://localhost:4200
