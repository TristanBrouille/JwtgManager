<div class="app">
  <aside>
    <a class="brand" routerLink="/tableau-de-bord">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <path d="M4 22c3-9 9-15 18-16l4 3-3 2 2 3-4 1c-2 5-6 8-11 9z" fill="#5cc98b" />
        <circle cx="20" cy="10" r="1.6" fill="#0a1410" />
        <path d="M4 22l-2 4 6-2" fill="#5cc98b" />
      </svg>
      JWTG Manager
    </a>
    <nav aria-label="Navigation principale">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="on" ariaCurrentWhenActive="page">
          {{ link.label }}
          @if (link.path === '/especes' && speciesCount()) {
            <small>{{ speciesCount() }}</small>
          }
          @if (link.path === '/hybrides' && speciesCount()) {
            <small>{{ hybridsLabel() }}</small>
          }
        </a>
      }
    </nav>
    <div class="sidefoot">
      @if (auth.user(); as user) {
        <span
          >Connecté : <strong>{{ user.pseudo }}</strong></span
        >
      }
      <button type="button" class="ghost" (click)="auth.logout()">Se déconnecter</button>
    </div>
  </aside>
  <main>
    <router-outlet />
  </main>
</div>
